<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PiP Counter (Play Trigger Mode)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>

<body
    class="bg-slate-900 text-white flex flex-col items-center justify-center min-h-screen p-4 relative overflow-hidden">

    <div class="w-full max-w-sm bg-slate-800 rounded-3xl p-6 shadow-2xl text-center border border-slate-700 z-10">
        <h1 class="text-xl font-bold text-slate-400 mb-6 tracking-wide">PiP COUNTER</h1>

        <div class="bg-slate-950 rounded-2xl py-8 mb-4 border border-slate-800">
            <span id="counter-display" class="text-7xl font-mono font-bold select-none text-emerald-400">0</span>
        </div>

        <div class="mb-4 flex flex-col items-center justify-center">
            <span class="text-xs text-slate-500 mb-1">Canvas映像プレビュー (PiPのソース)</span>
            <canvas id="pip-canvas" class="border border-slate-700 rounded-lg bg-black"
                style="width: 120px; height: 120px;"></canvas>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <button id="btn-minus"
                class="bg-slate-700 hover:bg-slate-600 active:scale-95 text-2xl font-bold py-4 rounded-xl transition-all">
                -1
            </button>
            <button id="btn-plus"
                class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-2xl font-bold py-4 rounded-xl transition-all">
                +1
            </button>
        </div>

        <div class="flex flex-col gap-3">
            <button id="btn-reset"
                class="bg-slate-800 hover:bg-slate-700 text-slate-400 font-medium py-2 rounded-xl border border-slate-700 transition-all">
                リセット
            </button>

            <hr class="border-slate-700 my-2">

            <button id="btn-pip"
                class="bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-xl shadow-lg transition-all">
                PiPモードを起動
            </button>
        </div>
    </div>

    <video id="pip-video" playsinline muted class="absolute pointer-events-none"
        style="width: 300px; height: 300px; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.01; z-index: -10;"></video>

    <script>
        let count = parseInt(localStorage.getItem('pip_counter_value')) || 0;

        const display = document.getElementById('counter-display');
        const btnPlus = document.getElementById('btn-plus');
        const btnMinus = document.getElementById('btn-minus');
        const btnReset = document.getElementById('btn-reset');
        const btnPip = document.getElementById('btn-pip');

        const canvas = document.getElementById('pip-canvas');
        const ctx = canvas.getContext('2d');
        const CANVAS_SIZE = 300;
        canvas.width = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;

        const video = document.getElementById('pip-video');

        const PLAY_GUARD_MS = 800;
        const PLAY_DEDUP_MS = 250;
        let ignorePlayUntil = 0;
        let lastPlayHandledAt = 0;
        let mediaSessionReady = false;
        let pipAssumedActive = false;

        function suppressPlay(ms = PLAY_GUARD_MS) {
            const until = Date.now() + ms;
            if (until > ignorePlayUntil) ignorePlayUntil = until;
        }

        function isInPipMode() {
            if (document.pictureInPictureElement === video) return true;
            if (typeof video.webkitPresentationMode === 'string') {
                return video.webkitPresentationMode === 'picture-in-picture';
            }
            return pipAssumedActive;
        }

        function shouldCountPlay() {
            if (!isInPipMode()) return false;
            if (Date.now() < ignorePlayUntil) return false;
            return true;
        }

        // ストリームバインド
        const videoStream = canvas.captureStream(15);
        const canvasVideoTrack = videoStream.getVideoTracks()[0] || null;
        const combinedStream = new MediaStream();
        videoStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));
        video.srcObject = combinedStream;

        let togglePixel = false;

        function flushCanvasFrame() {
            if (canvasVideoTrack && typeof canvasVideoTrack.requestFrame === 'function') {
                canvasVideoTrack.requestFrame();
            }
        }

        function drawCanvas() {
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            ctx.fillStyle = '#34d399';
            ctx.font = 'bold 90px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(count, CANVAS_SIZE / 2, CANVAS_SIZE / 2);

            togglePixel = !togglePixel;
            ctx.fillStyle = togglePixel ? '#020618' : '#020617';
            ctx.fillRect(0, 0, 1, 1);

            flushCanvasFrame();
        }

        function updateDisplay() {
            display.textContent = count;
            localStorage.setItem('pip_counter_value', count);
            drawCanvas();
        }

        // Canvasの定期描画（ビデオが停止していてもCanvas自体は最新の数値を描画し続ける）
        setInterval(drawCanvas, 66);
        (function drawLoop() {
            requestAnimationFrame(() => {
                if (isInPipMode()) {
                    drawCanvas();
                }
                drawLoop();
            });
        })();

        // Initialize MediaSession without forcing playback.
        function prepareMediaSession() {
            if (!('mediaSession' in navigator)) return;

            if (!mediaSessionReady) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'PiP Counter',
                    artist: '▶︎ ボタンタップで [+1]'
                });

                if (typeof navigator.mediaSession.setActionHandler === 'function') {
                    try {
                        navigator.mediaSession.setActionHandler('play', () => {
                            handlePlayTrigger('media');
                        });
                        navigator.mediaSession.setActionHandler('pause', () => {
                            if (!video.paused) video.pause();
                            navigator.mediaSession.playbackState = 'paused';
                        });
                    } catch (e) {
                    }
                }

                mediaSessionReady = true;
            }

            navigator.mediaSession.playbackState = 'paused';
        }
        document.addEventListener('touchstart', prepareMediaSession, { passive: true });
        document.addEventListener('click', prepareMediaSession, { passive: true });

        // PiP起動
        function startPiP() {
            // iOS仕様：一度playを呼び出さないとPiP化できないため、一瞬だけ再生して即座に一時停止する
            suppressPlay();
            video.play().then(() => {
                video.pause(); // デフォルトを停止状態に
                prepareMediaSession();

                if (typeof video.webkitSetPresentationMode === 'function') {
                    video.webkitSetPresentationMode('picture-in-picture');
                    pipAssumedActive = true;
                } else if (video.requestPictureInPicture) {
                    video.requestPictureInPicture()
                        .then(() => { pipAssumedActive = true; })
                        .catch(err => console.log(err));
                }
            }).catch(err => console.log(err));
        }

        function handlePlayTrigger(source) {
            const now = Date.now();
            if (now - lastPlayHandledAt < PLAY_DEDUP_MS) {
                if (!video.paused) video.pause();
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.playbackState = 'paused';
                }
                return;
            }
            lastPlayHandledAt = now;

            if (!shouldCountPlay()) {
                if (!video.paused) video.pause();
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.playbackState = 'paused';
                }
                return;
            }

            console.log("リモコン再生(▶︎)入力検知: +1");
            count++;
            updateDisplay();

            suppressPlay(200);

            // Return to paused state quickly to keep PiP controls on ▶︎.
            setTimeout(() => {
                video.pause();
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.playbackState = 'paused';
                }
            }, 50);
        }

        video.addEventListener('play', () => {
            handlePlayTrigger();
        });

        // 停止イベント時は何もせずスルー
        video.addEventListener('pause', () => {
            // ここではカウントを増やさない
        });

        // ライフサイクル管理
        video.addEventListener('leavepictureinpicture', () => {
            pipAssumedActive = false;
            updateDisplay();
        });
        if (typeof video.webkitSetPresentationMode === 'function') {
            video.addEventListener('webkitpresentationmodechanged', () => {
                if (video.webkitPresentationMode === 'inline') {
                    pipAssumedActive = false;
                    updateDisplay();
                } else if (video.webkitPresentationMode === 'picture-in-picture') {
                    pipAssumedActive = true;
                }
            });
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                suppressPlay();
                count = parseInt(localStorage.getItem('pip_counter_value')) || 0;
                updateDisplay();
            }
        });

        // イベントリスナー
        btnPlus.addEventListener('click', () => { count++; updateDisplay(); });
        btnMinus.addEventListener('click', () => { count--; if (count < 0) count = 0; updateDisplay(); });
        btnReset.addEventListener('click', () => { count = 0; updateDisplay(); });
        btnPip.addEventListener('click', startPiP);

        // 初回起動
        updateDisplay();
    </script>
</body>

</html>
